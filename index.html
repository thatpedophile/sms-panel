<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-PANEL | GOD MODE v57</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #030303; --sidebar: #0a0a0c; --surface: #121216; 
            --primary: #6366f1; --border: #1f1f23; --text: #ffffff; 
            --text-dim: #6b7280; --success: #10b981; --danger: #ef4444; --god: #f59e0b;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.15s ease; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* GOD MODE SPECIFIC UI */
        .god-badge { background: linear-gradient(45deg, #f59e0b, #ef4444); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        /* LAYOUT */
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; }
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
        .bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        /* BUTTONS */
        .btn { padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; display: inline-block; font-size: 13px; width: 100%; }
        .btn-god { background: var(--god); color: black; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        input, select, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 10px; color: white; margin-top: 5px; outline: none; margin-bottom: 10px; }
        .hidden { display: none !important; }
        #authScreen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="authScreen">
    <div style="width: 350px; text-align: center; background: var(--surface); padding: 40px; border-radius: 30px; border: 1px solid var(--border);">
        <h1 style="margin:0; letter-spacing:-1px;">NEXUS <span style="color:var(--god)">57</span></h1>
        <p style="color:var(--text-dim); font-size:12px; margin-bottom:30px;">Professional God-Mode Terminal</p>
        <input type="text" id="authU" placeholder="Username">
        <input type="password" id="authP" placeholder="Password">
        <button class="btn btn-primary" onclick="login()">AUTHORIZE SESSION</button>
    </div>
</div>

<div id="app" class="hidden" style="width:100%; display:flex;">
    <aside class="sidebar">
        <div style="font-size:20px; font-weight:800; margin-bottom:40px;">⚡ SYSTEM <span style="color:var(--primary)">.</span></div>
        <nav>
            <div class="nav-item" style="padding:10px; cursor:pointer;" onclick="tab('market')">🛒 Market</div>
            <div class="nav-item" style="padding:10px; cursor:pointer;" onclick="tab('news')">📢 News</div>
            <div class="nav-item" style="padding:10px; cursor:pointer;" onclick="tab('history')">📜 Ledger</div>
            <div id="godTab" class="hidden" style="margin-top:30px; border-top:1px solid var(--border); padding-top:20px;">
                <p style="font-size:10px; font-weight:900; color:var(--god);">DIVINE ACCESS</p>
                <div class="nav-item" style="color:var(--god); padding:10px; cursor:pointer;" onclick="tab('god')">👑 GOD MODE</div>
            </div>
        </nav>
        <button class="btn btn-danger" style="margin-top:auto" onclick="location.reload()">TERMINATE</button>
    </aside>

    <main class="main">
        <div id="view-market">
            <div class="bento">
                <div class="card" style="grid-column: span 2;">
                    <h3>Initialize Number</h3>
                    <select id="selCountry"></select>
                    <select id="selSvc"></select>
                    <button class="btn btn-primary" onclick="buy()">ORDER ACCESS</button>
                </div>
                <div class="card" style="background:var(--primary);">
                    <p style="font-size:11px; font-weight:800; opacity:0.7;">TOTAL VAULT</p>
                    <h1 id="bal" style="font-size:48px; margin:0;">$0.00</h1>
                </div>
            </div>
            <div id="activeBox" style="margin-top:20px;"></div>
        </div>

        <div id="view-god" class="hidden">
            <h1 style="color:var(--god)">Divine Command Center</h1>
            <div class="bento">
                <div class="card">
                    <h4>Global Wealth Control</h4>
                    <input type="text" id="gU" placeholder="Username">
                    <input type="number" id="gA" placeholder="Amount (+/-)">
                    <button class="btn btn-god" onclick="godBal()">FORCE BALANCE</button>
                </div>
                <div class="card">
                    <h4>Service Integrity</h4>
                    <select id="gSvcList"></select>
                    <button class="btn btn-primary" onclick="toggleSvc(true)">ONLINE</button>
                    <button class="btn btn-danger" style="margin-top:5px" onclick="toggleSvc(false)">OFFLINE</button>
                </div>
                <div class="card">
                    <h4>System Nuclear Option</h4>
                    <button class="btn btn-danger" onclick="wipeDB()">WIPE ALL USER DATA</button>
                    <button class="btn btn-god" style="margin-top:5px" onclick="exportMaster()">EXPORT MASTER AUDIT</button>
                </div>
            </div>
            <div class="card">
                <h4>Master Transaction Stream (Live)</h4>
                <div style="max-height:300px; overflow-y:auto;" id="masterTx"></div>
            </div>
        </div>

        <div id="view-news" class="hidden"><h1>News Feed</h1><div id="newsHub"></div></div>
        <div id="view-history" class="hidden"><h1>My History</h1><div class="card" id="userTx"></div></div>
    </main>
</div>

<script>
    let user = null, active = null;
    let db = JSON.parse(localStorage.getItem('GOD_MODE_V57')) || {
        users: { 'sh1vx': { p: 'admin123', b: 5000, role: 'admin', tx: [] } },
        svcs: { 'Telegram': { p: 0.85, s: true }, 'WhatsApp': { p: 0.45, s: true }, 'Instagram': { p: 0.35, s: true } },
        countries: ['India', 'USA', 'UK'],
        news: [{ t: 'Protocol 57 Loaded', c: 'God Mode features finalized. Service kill-switches active.', d: '2026-03-16' }]
    };

    function login() {
        let u = document.getElementById('authU').value.trim().toLowerCase(), p = document.getElementById('authP').value;
        if(!db.users[u]) { db.users[u] = { p, b: 0, role: 'user', tx: [] }; save(); }
        if(db.users[u].p === p) {
            user = u; document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            if(db.users[u].role === 'admin') document.getElementById('godTab').classList.remove('hidden');
            sync();
        } else { alert("Invalid Credentials"); }
    }

    function sync() {
        document.getElementById('bal').innerText = "$" + db.users[user].b.toFixed(2);
        document.getElementById('selCountry').innerHTML = db.countries.map(c => `<option>${c}</option>`).join('');
        
        // Populate Market & God Svc List
        let svcHTML = "";
        for(let [n, d] of Object.entries(db.svcs)) {
            let status = d.s ? `<span class="status-dot status-online"></span>` : `<span class="status-dot status-offline"></span>`;
            svcHTML += `<option value="${n}" ${!d.s ? 'disabled' : ''}>${n} ($${d.p.toFixed(2)}) ${!d.s ? '[MAINTENANCE]' : ''}</option>`;
        }
        document.getElementById('selSvc').innerHTML = svcHTML;
        document.getElementById('gSvcList').innerHTML = Object.keys(db.svcs).map(n => `<option>${n}</option>`).join('');

        // Master Tx Stream (God Mode)
        if(db.users[user].role === 'admin') {
            let allTx = [];
            for(let u in db.users) db.users[u].tx.forEach(t => allTx.push({u, ...t}));
            document.getElementById('masterTx').innerHTML = allTx.sort((a,b) => b.id-a.id).map(t => `<div style="padding:10px; border-bottom:1px solid #1f1f23; font-size:12px;"><b>${t.u.toUpperCase()}</b>: ${t.m} ($${t.a.toFixed(2)}) <span style="color:var(--text-dim)">${t.d}</span></div>`).join('');
        }

        // News & Personal History
        document.getElementById('newsHub').innerHTML = db.news.map(n => `<div class="card"><h4>${n.t}</h4><p>${n.c}</p></div>`).reverse().join('');
        document.getElementById('userTx').innerHTML = db.users[user].tx.map(t => `<div style="padding:10px; border-bottom:1px solid #1f1f23;">${t.m} - $${t.a.toFixed(2)}</div>`).reverse().join('');
    }

    function buy() {
        if(active) return alert("Finish active order.");
        let n = document.getElementById('selSvc').value, p = db.svcs[n].p;
        if(db.users[user].b < p) return alert("Insufficient Balance");
        db.users[user].b -= p;
        active = { n, p, num: "+1 888 " + Math.floor(100+Math.random()*899) + " " + Math.floor(1000+Math.random()*8999) };
        log('DEBIT', `Purchased ${n} access`, p);
        renderOrder(); sync();
    }

    function renderOrder() {
        const box = document.getElementById('activeBox');
        if(!active) { box.innerHTML = ''; return; }
        box.innerHTML = `<div class="card" style="border: 2px solid var(--primary);">
            <div style="display:flex; justify-content:space-between;">
                <div><small>VIRTUAL NUMBER</small><h1>${active.num}</h1><p style="color:var(--success)">● Monitoring SMS...</p></div>
                <div><button class="btn btn-danger" onclick="cancel()">CANCEL & REFUND</button> <button class="btn btn-primary" style="margin-top:5px" onclick="active=null;buy()">RE-CYCLE</button></div>
            </div>
        </div>`;
    }

    function cancel() {
        db.users[user].b += active.p;
        log('CREDIT', `Refunded ${active.n}`, active.p);
        active = null; renderOrder(); sync();
    }

    // GOD MODE FUNCTIONS
    function godBal() {
        let u = document.getElementById('gU').value.toLowerCase(), a = parseFloat(document.getElementById('gA').value);
        if(db.users[u]) { db.users[u].b += a; logOther(u, 'DIVINE_ADJUST', `Admin modified balance`, a); sync(); alert("Success"); }
    }

    function toggleSvc(state) {
        let s = document.getElementById('gSvcList').value;
        db.svcs[s].s = state; save(); sync(); alert(`${s} is now ${state?'ONLINE':'OFFLINE'}`);
    }

    function wipeDB() {
        if(confirm("DANGER: This wipes ALL user data. Only Admin credentials survive. Proceed?")) {
            let adminSave = db.users['sh1vx'];
            db.users = { 'sh1vx': adminSave };
            save(); sync(); location.reload();
        }
    }

    function exportMaster() {
        let data = "GOD MODE MASTER AUDIT\n" + JSON.stringify(db, null, 2);
        let blob = new Blob([data], {type: "text/plain"});
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "master_audit.txt"; a.click();
    }

    function log(t, m, a) { 
        db.users[user].tx.push({ id: Date.now(), d: new Date().toLocaleTimeString(), t, m, a }); 
        save(); 
    }
    
    function logOther(u, t, m, a) {
        db.users[u].tx.push({ id: Date.now(), d: new Date().toLocaleTimeString(), t, m, a });
        save();
    }

    function tab(v) {
        document.querySelectorAll('.main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('view-'+v).classList.remove('hidden');
    }
    function save() { localStorage.setItem('GOD_MODE_V57', JSON.stringify(db)); }
</script>
</body>
</html>
